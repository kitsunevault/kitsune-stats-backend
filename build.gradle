plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kitsunestats'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // JWT de Kitsune Stats: lo emite users-service (login único de Kitsune) con su propio secreto.
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// En desarrollo los servicios de Kitsune (users y orders) sirven HTTPS con el certificado
// autofirmado de KitsuneShop/certs: el RestClient necesita confiar en él.
tasks.named('bootRun') {
    def truststore = file('../../KitsuneShop/certs/dev-truststore.p12')
    if (truststore.exists()) {
        jvmArgs(
            "-Djavax.net.ssl.trustStore=${truststore.absolutePath}",
            '-Djavax.net.ssl.trustStorePassword=changeit',
            '-Djavax.net.ssl.trustStoreType=PKCS12'
        )
    }
}

// Nombre fijo: systemd apunta a /opt/kitsune/stats-service.jar.
bootJar {
    archiveFileName = 'stats-service.jar'
}
