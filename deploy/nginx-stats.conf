# Kitsune Stats en stats.kitsunevaults.com. Va en /etc/nginx/sites-available/kitsune-stats
# (enlazado en sites-enabled). El server_name exacto gana sobre el comodín
# *.kitsunevaults.com de las tiendas, y usa el mismo certificado comodín.
server {
    server_name stats.kitsunevaults.com;

    root /var/www/kitsune-stats/browser;
    index index.html;

    # Rutas del router de Angular (/meta, /lider/OP05-119...): si no es un archivo, index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # La API en el mismo dominio: sin peticiones cruzadas (CORS).
    location /api/ {
        proxy_pass http://127.0.0.1:8085/api/;
        include /etc/nginx/proxy_params_kitsune;
    }

    # Para el monitor (UptimeRobot): solo la salud, no el resto de actuator.
    location = /salud {
        proxy_pass http://127.0.0.1:8085/actuator/health;
        include /etc/nginx/proxy_params_kitsune;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/kitsunevaults.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kitsunevaults.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name stats.kitsunevaults.com;
    return 301 https://$host$request_uri;
}
